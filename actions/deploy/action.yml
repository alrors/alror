name: Alror deploy
description: Run a risk-scored, verified progressive rollout and roll back automatically if the canary regresses.
author: Alror
branding:
  icon: shield
  color: green

inputs:
  service:
    description: Service name from alror.yaml.
    required: true
  image:
    description: Image or artifact to roll out.
    required: true
  ref:
    description: PR number or commit shown in history and notifications.
    default: ${{ github.sha }}
  working-directory:
    description: Directory containing alror.yaml.
    default: "."
  shadow:
    description: Shadow mode, which recommends rollbacks but never acts.
    default: "false"
  comment:
    description: Keep a deployment receipt comment on the pull request, when one is available.
    default: "true"
  pull-request:
    description: Optional PR number for push or workflow_dispatch runs. Defaults to the event PR.
    default: ""
  token:
    description: Token used to post the deployment comment (requires pull-requests write).
    default: ${{ github.token }}
  version:
    description: Alror version to install (a git tag, or "latest").
    default: latest

outputs:
  deployment-id:
    description: The Alror deployment id.
    value: ${{ steps.deploy.outputs.deployment-id }}
  status:
    description: promoted, rolled_back or failed.
    value: ${{ steps.deploy.outputs.status }}
  weight:
    description: Last rollout stage reached; after rollback this is not the current traffic weight.
    value: ${{ steps.deploy.outputs.weight }}
  risk:
    description: Release risk score from 0 to 100.
    value: ${{ steps.deploy.outputs.risk }}
  reason:
    description: Rollback or failure reason, when available.
    value: ${{ steps.deploy.outputs.reason }}
  duration:
    description: Elapsed rollout time, e.g. 2m15s.
    value: ${{ steps.deploy.outputs.duration }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false

    - name: Install alror
      shell: bash
      env:
        ALROR_VERSION: ${{ inputs.version }}
      run: go install "github.com/alrors/alror/cmd/alror@$ALROR_VERSION"

    - name: Deploy
      id: deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NO_COLOR: "1"
        GITHUB_TOKEN: ${{ inputs.token }}
        ALROR_GITHUB_COMMENT: ${{ inputs.comment }}
        ALROR_GITHUB_PR: ${{ inputs.pull-request }}
        ALROR_SERVICE: ${{ inputs.service }}
        ALROR_IMAGE: ${{ inputs.image }}
        ALROR_REF: ${{ inputs.ref }}
        ALROR_SHADOW: ${{ inputs.shadow }}
      run: |
        args=(deploy -s "$ALROR_SERVICE" -i "$ALROR_IMAGE" --ref "$ALROR_REF")
        if [ "$ALROR_SHADOW" = "true" ]; then args+=(--shadow); fi
        # Exit code 2 means "rolled back": fail the job so the bad release is visible.
        alror "${args[@]}"
