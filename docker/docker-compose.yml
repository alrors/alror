# Self-host the Alror workspace: website, console and /api/v1, with PostgreSQL, Redis and Caddy (automatic HTTPS).
#   cp .env.example .env   # fill in DOMAIN and the secrets
#   docker compose up -d
name: alror
services:
  web:
    build: ../apps/web
    image: alror-web:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://alror:${POSTGRES_PASSWORD}@postgres:5432/alror
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALROR_SESSION_SECRET: ${ALROR_SESSION_SECRET}
      ALROR_PUBLIC_URL: https://${DOMAIN}
      ALROR_PLATFORM_ADMINS: ${ALROR_PLATFORM_ADMINS:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alror
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: alror
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U alror"], interval: 10s, timeout: 5s, retries: 5 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"], interval: 10s, timeout: 5s, retries: 5 }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
volumes: { pgdata: {}, redisdata: {}, caddy_data: {}, caddy_config: {} }
