<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a93"/>
    </marker>
    <style>
      .t{fill:#ededed;font-size:17px;font-weight:600}
      .s{fill:#a1a1a1;font-size:13.5px}
      .h{fill:#737373;font-size:12px;font-weight:600;letter-spacing:.12em}
      .l{fill:#8a8a93;font-size:12.5px}
      .box{fill:#171717;stroke:#2e2e2e;stroke-width:1.2}
      .grp{fill:#121212;stroke:#262626;stroke-width:1.2}
      .acc{fill:#171717;stroke:#35e08f;stroke-width:1.4}
      .ln{stroke:#8a8a93;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="1200" height="560" rx="18" fill="#0d0d0f"/>

  <!-- Your code -->
  <text x="40" y="58" class="h">YOUR CODE</text>
  <rect x="32" y="76" width="250" height="78" rx="12" class="box"/>
  <text x="54" y="108" class="t">GitHub pull request</text>
  <text x="54" y="132" class="s">diff, authors, tests</text>
  <rect x="32" y="186" width="250" height="78" rx="12" class="box"/>
  <text x="54" y="218" class="t">CI (any)</text>
  <text x="54" y="242" class="s">alror deploy as one step</text>
  <rect x="32" y="296" width="250" height="78" rx="12" class="box"/>
  <text x="54" y="328" class="t">Alror console</text>
  <text x="54" y="352" class="s">Deploy · Roll back buttons</text>

  <!-- Engine -->
  <rect x="352" y="40" width="430" height="480" rx="16" class="grp"/>
  <text x="376" y="70" class="h">ALROR ENGINE · CLI OR RUNNER</text>
  <rect x="376" y="88" width="382" height="72" rx="12" class="acc"/>
  <text x="398" y="118" class="t">Risk scorer</text>
  <text x="398" y="142" class="s">0–100 from named factors</text>
  <rect x="376" y="196" width="382" height="72" rx="12" class="box"/>
  <text x="398" y="226" class="t">Planner + rollout engine</text>
  <text x="398" y="250" class="s">1% → 5% → 25% → 50% → 100%, sized by risk</text>
  <rect x="376" y="304" width="382" height="72" rx="12" class="box"/>
  <text x="398" y="334" class="t">Verifier</text>
  <text x="398" y="358" class="s">Mann-Whitney U + effect size, per stage</text>
  <rect x="376" y="412" width="382" height="84" rx="12" class="box"/>
  <text x="398" y="442" class="t">State</text>
  <text x="398" y="466" class="s">local: alror.yaml + .alror/ JSON</text>
  <text x="398" y="486" class="s">connected: workspace API (Postgres, Redis)</text>
  <path d="M567 160v36" class="ln" marker-end="url(#a)"/>
  <text x="577" y="183" class="l">sets the plan</text>
  <path d="M567 268v36" class="ln" marker-end="url(#a)"/>

  <!-- Your infra -->
  <text x="890" y="58" class="h">YOUR INFRASTRUCTURE</text>
  <rect x="882" y="76" width="286" height="78" rx="12" class="box"/>
  <text x="904" y="108" class="t">Kubernetes · ECS</text>
  <text x="904" y="132" class="s">Argo Rollouts shifts canary traffic</text>
  <rect x="882" y="186" width="286" height="78" rx="12" class="box"/>
  <text x="904" y="218" class="t">Prometheus · Datadog</text>
  <text x="904" y="242" class="s">error rate, p95 latency</text>
  <rect x="882" y="296" width="286" height="78" rx="12" class="box"/>
  <text x="904" y="328" class="t">Slack · GitHub checks</text>
  <text x="904" y="352" class="s">verdicts and rollback reasons</text>

  <!-- Arrows -->
  <path d="M282 115 H374" class="ln" marker-end="url(#a)"/>
  <text x="296" y="106" class="l">PR diff</text>
  <path d="M282 225 H374" class="ln" marker-end="url(#a)"/>
  <text x="296" y="216" class="l">deploy</text>
  <path d="M282 335 C330 335 330 240 374 240" class="ln" marker-end="url(#a)"/>
  <text x="290" y="296" class="l">job</text>
  <path d="M760 225 C820 225 830 115 880 115" class="ln" marker-end="url(#a)"/>
  <text x="808" y="150" class="l">shift traffic</text>
  <path d="M880 225 C830 225 820 330 760 330" class="ln" marker-end="url(#a)"/>
  <text x="826" y="262" class="l">metrics</text>
  <path d="M760 360 C820 360 830 335 880 335" class="ln" marker-end="url(#a)"/>
  <text x="800" y="392" class="l">notify</text>
</svg>
